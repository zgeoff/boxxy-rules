# Loads each pull request's rules with the boxxy server's own reader and loader, so a pull request
# the server would refuse cannot merge. The ruleset on main requires this job.
name: rules check
on:
  pull_request:
  push:
    branches: [main]
permissions:
  contents: read
jobs:
  rules-check:
    runs-on: ubuntu-latest
    timeout-minutes: 5
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: oven-sh/setup-bun@0c5077e51419868618aeaa5fe8019c62421857d6 # v2.2.0
        with:
          bun-version-file: .github/rules-check/.bun-version
      - run: bun install --frozen-lockfile
        working-directory: .github/rules-check
      - run: bun check-rules.ts "$GITHUB_WORKSPACE"
        working-directory: .github/rules-check
